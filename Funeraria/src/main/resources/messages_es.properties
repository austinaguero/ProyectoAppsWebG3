inicio.quienesSomos=\u00bfQui\u00e9nes somos?
inicio.quienesSomos.texto=Somos una empresa costarricense dedicada a la prestaci\u00f3n de servicios funerarios integrales, con sede principal en San Jos\u00e9 y presencia operativa en las provincias de Alajuela, Cartago y Heredia. Hemos atendido a m\u00e1s de 12.000 familias, ofreciendo un portafolio de servicios variados. Actualmente, la empresa emplea a m\u00e1s de 60 personas entre personal operativo, administrativo y de atenci\u00f3n al cliente, y opera dos sedes propias con capillas velatorias adem\u00e1s de convenios con seis cementerios distribuidos en la Gran \u00c1rea Metropolitana.
inicio.vision=Nuestra visi\u00f3n
inicio.vision.texto1=Fundada en el a\u00f1o 2008 por un grupo de emprendedores locales con experiencia en el sector, la empresa surgi\u00f3 como respuesta a la creciente necesidad de un servicio funerario que combinara respeto por las tradiciones costarricenses con est\u00e1ndares modernos de atenci\u00f3n al cliente.
inicio.vision.texto2=La misi\u00f3n de la empresa se centra en acompa\u00f1ar a las familias en momentos dif\u00edciles con calidez, dignidad y transparencia.
