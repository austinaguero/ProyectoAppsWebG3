inicio.quienesSomos=Who are we?
inicio.quienesSomos.texto=We are a Costa Rican company dedicated to providing comprehensive funeral services, headquartered in San Jos\u00e9 with operations in the provinces of Alajuela, Cartago and Heredia. We have served more than 12,000 families, offering a varied portfolio of services. The company currently employs more than 60 people across operations, administration and customer service, and runs two of its own locations with funeral chapels, as well as agreements with six cemeteries throughout the Greater Metropolitan Area.
inicio.vision=Our vision
inicio.vision.texto1=Founded in 2008 by a group of local entrepreneurs with experience in the sector, the company arose in response to the growing need for a funeral service that combined respect for Costa Rican traditions with modern customer service standards.
inicio.vision.texto2=The company's mission is to accompany families through difficult moments with warmth, dignity and transparency.
