<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Memoriales del Valle - Iniciar Sesión</title>

        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kapakana&family=Kavivanar&display=swap" rel="stylesheet">

        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

        <style>
            :root {
                --color-primary: #647061;
                --color-gold: #9D7C34;
                --color-sage: #A6C7BA;
                --color-dusty: #9DB5AC;
                --color-beige: #C3BAA6;
                --color-moss: #859381;
                --color-text: #666666;
            }

            body {
                font-family: 'Kavivanar', cursive, sans-serif;
                background-color: #f4f6f5;
                color: var(--color-text);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            h1, h2, h3, .brand-title {
                font-family: 'Kapakana', cursive, serif;
            }

            .login-card {
                background-color: #ffffff;
                border: 2px solid var(--color-beige);
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(100, 112, 97, 0.15);
                overflow: hidden;
                width: 100%;
                max-width: 420px;
            }

            .login-header {
                background-color: var(--color-primary);
                color: #ffffff;
                padding: 2.5rem 1.5rem 1.5rem;
                text-align: center;
            }

            .login-header h2 {
                font-size: 2.2rem;
                margin-bottom: 0.2rem;
                color: #ffffff;
            }

            .login-header small {
                color: var(--color-sage);
                font-size: 1rem;
            }

            .btn-gold {
                background-color: var(--color-gold);
                color: #ffffff;
                font-weight: 600;
                border: none;
                border-radius: 8px;
                padding: 0.75rem;
                transition: all 0.3s ease;
            }
