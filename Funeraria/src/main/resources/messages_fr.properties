inicio.quienesSomos=Qui sommes-nous ?
inicio.quienesSomos.texto=Nous sommes une entreprise costaricienne d\u00e9di\u00e9e \u00e0 la prestation de services fun\u00e9raires complets, dont le si\u00e8ge est \u00e0 San Jos\u00e9, avec une pr\u00e9sence op\u00e9rationnelle dans les provinces d'Alajuela, Cartago et Heredia. Nous avons accompagn\u00e9 plus de 12 000 familles en proposant un portefeuille de services vari\u00e9s. L'entreprise emploie actuellement plus de 60 personnes entre personnel op\u00e9rationnel, administratif et service client, et exploite deux sites propres dot\u00e9s de chapelles fun\u00e9raires, ainsi que des accords avec six cimeti\u00e8res de la Grande Zone M\u00e9tropolitaine.
inicio.vision=Notre vision
inicio.vision.texto1=Fond\u00e9e en 2008 par un groupe d'entrepreneurs locaux exp\u00e9riment\u00e9s dans le secteur, l'entreprise est n\u00e9e pour r\u00e9pondre au besoin croissant d'un service fun\u00e9raire alliant le respect des traditions costariciennes \u00e0 des normes modernes de service client.
inicio.vision.texto2=La mission de l'entreprise est d'accompagner les familles dans les moments difficiles avec chaleur, dignit\u00e9 et transparence.
