spring.application.name=Funeraria_G3
#para definir el puerto donde "escuchará" el servidor
server.port=8092

#Clase 2
#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm
 
#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off
 
#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Devtools: el reinicio automático espera a que la compilación termine de escribir todas las clases.
#Con los valores por omisión (1s / 400ms) reiniciaba a mitad de la compilación y el sistema
#quedaba levantado sin controladores (error 404 "No static resource" en todas las páginas)
spring.devtools.restart.poll-interval=6s
spring.devtools.restart.quiet-period=5s

#Conexión aivencloud a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://techshop-jafetoviedo12-4ab8.l.aivencloud.com:15927/Proyecto

spring.datasource.username=avnadmin
spring.datasource.password=AVNS_9yOG9wr47Gzro34BiVO
                                                                     
#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE


