inicio.quienesSomos=Quem somos?
inicio.quienesSomos.texto=Somos uma empresa costarriquenha dedicada \u00e0 presta\u00e7\u00e3o de servi\u00e7os funer\u00e1rios completos, com sede principal em San Jos\u00e9 e presen\u00e7a operacional nas prov\u00edncias de Alajuela, Cartago e Heredia. J\u00e1 atendemos mais de 12.000 fam\u00edlias, oferecendo um portf\u00f3lio de servi\u00e7os variados. Atualmente, a empresa emprega mais de 60 pessoas entre pessoal operacional, administrativo e de atendimento ao cliente, e opera duas sedes pr\u00f3prias com capelas mortu\u00e1rias, al\u00e9m de conv\u00eanios com seis cemit\u00e9rios distribu\u00eddos na Grande \u00c1rea Metropolitana.
inicio.vision=Nossa vis\u00e3o
inicio.vision.texto1=Fundada em 2008 por um grupo de empreendedores locais com experi\u00eancia no setor, a empresa surgiu como resposta \u00e0 crescente necessidade de um servi\u00e7o funer\u00e1rio que combinasse respeito pelas tradi\u00e7\u00f5es costarriquenhas com padr\u00f5es modernos de atendimento ao cliente.
inicio.vision.texto2=A miss\u00e3o da empresa \u00e9 acompanhar as fam\u00edlias em momentos dif\u00edceis com carinho, dignidade e transpar\u00eancia.
